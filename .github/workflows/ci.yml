name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Run deep protocol tests with evidence
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test 2>&1 | tee artifacts/test.tap
          sha256sum artifacts/test.tap > artifacts/test.sha256
      - run: npm run build
      - run: node scripts/hash-directory.mjs .next artifacts/web-build-digest.json
      - name: Generate supply-chain and V10 liveness evidence
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format=cyclonedx > artifacts/sbom.cdx.json
          sha256sum package.json > artifacts/package-json.sha256
          if [ -f package-lock.json ]; then sha256sum package-lock.json > artifacts/package-lock.sha256; fi
          sha256sum lib/deployment-epoch.ts lib/chain-finality.ts lib/protocol-state-root.ts lib/oracle-funding-anchor.ts lib/cross-product-reconciliation.ts lib/release-lifecycle.ts lib/deep-preprod-release.ts > artifacts/deep-release-sources.sha256
          sha256sum lib/registry-critical-state.ts lib/protocol-migration.ts lib/risk-parameter-governance.ts lib/withdrawal-settlement.ts lib/critical-liquidation.ts lib/operator-set-governance.ts lib/settlement-safety-root.ts lib/production-review-certificate.ts > artifacts/critical-control-sources.sha256
          sha256sum lib/review-transparency.ts lib/state-recovery.ts lib/protocol-economics.ts lib/oracle-independence.ts lib/settlement-disputes.ts lib/operator-accountability.ts lib/global-invariants.ts lib/upgrade-recovery.ts lib/critical-review-v9.ts > artifacts/v9-critical-sources.sha256
          sha256sum lib/provider-failover.ts lib/transaction-rebuild.ts lib/bounded-transaction-chain.ts lib/degraded-market-control.ts lib/operator-failover-plan.ts lib/liveness-policy-root.ts lib/registry-liveness-v10.ts lib/liveness-review-v10.ts > artifacts/v10-liveness-sources.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: symbiotic-web-build-provenance
          path: |
            artifacts/test.tap
            artifacts/test.sha256
            artifacts/web-build-digest.json
            artifacts/sbom.cdx.json
            artifacts/package-lock.sha256
            artifacts/package-json.sha256
            artifacts/deep-release-sources.sha256
            artifacts/critical-control-sources.sha256
            artifacts/v9-critical-sources.sha256
            artifacts/v10-liveness-sources.sha256
          if-no-files-found: warn

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Aiken
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/aiken-lang/aiken/releases/download/v1.1.22/aiken-installer.sh | sh
          echo "$HOME/.aiken/bin" >> "$GITHUB_PATH"
      - run: "$HOME/.aiken/bin/aiken --version"
      - run: "$HOME/.aiken/bin/aiken check --max-success=3500"
      - run: "$HOME/.aiken/bin/aiken build"
      - run: node scripts/verify-blueprint.mjs plutus.json
      - run: node scripts/export-validator-manifest.mjs plutus.json artifacts/validator-manifest.json
      - run: node scripts/export-parameter-schema.mjs plutus.json artifacts/parameter-schema.json
      - run: sha256sum plutus.json artifacts/validator-manifest.json artifacts/parameter-schema.json validators/registry.ak > artifacts/contracts.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: symbiotic-validator-artifacts
          path: |
            plutus.json
            artifacts/validator-manifest.json
            artifacts/parameter-schema.json
            artifacts/contracts.sha256
          if-no-files-found: error
