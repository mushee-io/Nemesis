name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @aiken-lang/aikup
      - run: aikup v1.1.22
      - run: aiken --version
      - run: aiken check
      - run: aiken build
      - run: node scripts/verify-blueprint.mjs plutus.json
      - run: node scripts/export-validator-manifest.mjs plutus.json artifacts/validator-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: symbiotic-validator-artifacts
          path: |
            plutus.json
            artifacts/validator-manifest.json
          if-no-files-found: error
